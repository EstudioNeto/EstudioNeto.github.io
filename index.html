<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Neto - Aplicativos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #01875f;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #7f8c8d;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 60px 20px 80px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        header p {
            margin: 10px 0 0;
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .container {
            flex: 1;
            max-width: 800px;
            margin: -50px auto 40px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .app-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 25px;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 25%;
            object-fit: cover;
            background-color: #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .app-info {
            flex: 1;
        }
        .app-info h2 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 800;
        }
        .app-info p {
            margin: 0 0 20px 0;
            color: var(--text-light);
            line-height: 1.6;
            font-size: 1.05rem;
        }
        .play-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s, transform 0.2s;
        }
        .play-btn:hover {
            background-color: #016b4a;
            transform: scale(1.02);
        }
        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            .app-card {
                flex-direction: column;
                text-align: center;
                padding: 25px 20px;
            }
            .app-icon {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Estúdio Neto</h1>
        <p>Soluções musicais para todos</p>
    </header>

    <div class="container">
        <!-- App: Sinosom -->
        <div class="app-card">
            <!-- A imagem 'sinosom.png' vai ser carregada aqui -->
            <img src="sinosom.png" alt="Ícone do Sinosom" class="app-icon" onerror="this.src='https://via.placeholder.com/120?text=App'">
            
            <div class="app-info">
                <h2>Sinosom</h2>
                <p>Transforma ciência acústica em soluções simples na palma da sua mão.</p>
                <a href="https://play.google.com/store/apps/details?id=COLOQUE_SEU_ID_AQUI" class="play-btn" target="_blank">
                    <svg viewBox="0 0 24 24"><path d="M5 2.059A3 3 0 0 0 2.06 4.965v14.07A3 3 0 0 0 5 21.941l15-9.882z"/></svg>
                    Baixar no Google Play
                </a>
            </div>
        </div>
        
    </div>

    <footer>
        &copy; 2026 - Desenvolvido por Estúdio Neto
    </footer>

</body>
</html>
