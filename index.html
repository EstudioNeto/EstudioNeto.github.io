<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Neto - Aplicativos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .app-box {
            border: 1px solid #eaeaea;
            padding: 25px;
            border-radius: 10px;
            background-color: #fafbfc;
        }
        .app-box h2 {
            margin: 0 0 10px 0;
            color: #2980b9;
            font-size: 24px;
        }
        .app-box p {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .play-btn {
            display: inline-block;
            background-color: #01875f;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .play-btn:hover {
            background-color: #016b4a;
        }
        .footer-links {
            margin-top: 30px;
            font-size: 13px;
        }
        .footer-links a {
            color: #95a5a6;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Estúdio Neto</h1>
        <p class="subtitle">Soluções musicais para todos</p>

        <div class="app-box">
            <h2>Sinosom</h2>
            <p>Transforma ciência acústica em soluções simples na palma da sua mão.</p>
            
            <!-- ATENÇÃO: Substitua o link abaixo pelo link exato do Sinosom na Play Store -->
            <a href="https://play.google.com/store/apps" class="play-btn" target="_blank">Baixar no Google Play</a>
        </div>

        <!-- O link abaixo garante que a página de privacidade do Lupa Digital continue acessível para o Google -->
        <div class="footer-links">
            <a href="privacidade.html">Política de Privacidade (Lupa Digital)</a>
        </div>
    </div>
</body>
</html>
